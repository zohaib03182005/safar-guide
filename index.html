<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Safar Guide — AI voice travel guide for Pakistan's Northern Areas. Ask about Hunza, Skardu, Naran, Swat in Urdu or English.">
<title>Safar Guide — AI Voice Travel Guide for Northern Pakistan</title>
<style>
  :root {
    --bg1: #0b1e2d; --bg2: #123a4a; --bg3: #0f2027;
    --accent: #4dd0a6; --accent-dark: #2ea87f;
    --text: #f2f7f5; --muted: rgba(242,247,245,.62);
    --card: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.10);
    --user-bubble: #1e7d5f; --bot-bubble: rgba(255,255,255,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, var(--bg2), transparent),
                linear-gradient(160deg, var(--bg1), var(--bg3));
    color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ---------- Header ---------- */
  header {
    width: min(760px, 100%); padding: 26px 22px 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem; box-shadow: 0 6px 20px rgba(77,208,166,.35);
  }
  .brand h1 { font-size: 1.35rem; letter-spacing: .2px; }
  .brand p { font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .badge {
    margin-left: auto; flex: none; font-size: .72rem; font-weight: 600;
    padding: 6px 12px; border-radius: 20px; white-space: nowrap;
    background: rgba(77,208,166,.14); color: var(--accent);
    border: 1px solid rgba(77,208,166,.35);
  }

  /* ---------- Chat ---------- */
  main { width: min(760px, 100%); flex: 1; display: flex; flex-direction: column; padding: 0 22px; min-height: 0; }
  #conversation {
    flex: 1; min-height: 300px; overflow-y: auto; padding: 14px 4px;
    display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
  }
  #conversation::-webkit-scrollbar { width: 6px; }
  #conversation::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }

  .row { display: flex; gap: 8px; align-items: flex-end; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .row.you { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
    background: var(--card); border: 1px solid var(--card-border);
  }
  .row.you .avatar { background: rgba(77,208,166,.18); border-color: rgba(77,208,166,.4); }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 16px; line-height: 1.6;
    font-size: .95rem; overflow-wrap: break-word;
  }
  .row.you .bubble { background: var(--user-bubble); border-bottom-right-radius: 5px; }
  .row.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--card-border); border-bottom-left-radius: 5px; }
  .bubble .time { display: block; font-size: .68rem; opacity: .5; margin-top: 5px; }
  .replay {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
    font-size: .75rem; background: rgba(77,208,166,.12); color: var(--accent);
    border: 1px solid rgba(77,208,166,.35); border-radius: 14px;
    padding: 4px 12px; cursor: pointer;
  }
  .replay:hover { background: rgba(77,208,166,.22); }
  .replay.needs-tap {
    animation: pulse 1.2s infinite; background: var(--accent); color: #0b1e2d;
    font-weight: 700; font-size: .85rem; padding: 8px 18px;
  }

  /* typing indicator */
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- Suggestion chips ---------- */
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 4px; }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font-size: .8rem; padding: 8px 14px; border-radius: 20px; cursor: pointer;
    background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); background: rgba(77,208,166,.12); }

  /* ---------- Input bar ---------- */
  #inputBar {
    display: flex; gap: 8px; align-items: center; padding: 12px 0 4px;
  }
  #micBtn {
    width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    font-size: 1.35rem; background: var(--accent); color: #0b1e2d;
    box-shadow: 0 4px 14px rgba(77,208,166,.4); transition: transform .12s;
  }
  #micBtn:hover { transform: scale(1.06); }
  #micBtn.listening { background: #ff6b6b; animation: pulse 1.2s infinite; }
  #micBtn:disabled { opacity: .4; cursor: default; transform: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,107,107,.55); }
    70% { box-shadow: 0 0 0 16px rgba(255,107,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); }
  }
  #textInput {
    flex: 1; padding: 13px 16px; border-radius: 24px; border: 1px solid var(--card-border);
    font-size: .95rem; background: var(--card); color: var(--text); outline: none;
    transition: border-color .15s;
  }
  #textInput:focus { border-color: var(--accent); }
  #textInput::placeholder { color: var(--muted); }
  #sendBtn {
    width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--accent); color: #0b1e2d; font-size: 1.2rem;
    box-shadow: 0 4px 14px rgba(77,208,166,.4); transition: transform .12s, opacity .12s;
  }
  #sendBtn:hover { transform: scale(1.06); }
  #sendBtn:disabled { opacity: .4; cursor: default; transform: none; }

  #statusRow { display: flex; align-items: center; gap: 10px; padding: 8px 2px 0; min-height: 2em; }
  #status { font-size: .8rem; color: var(--muted); flex: 1; }
  #clearBtn {
    font-size: .75rem; background: none; border: 1px solid var(--card-border);
    color: var(--muted); border-radius: 14px; padding: 5px 12px; cursor: pointer;
  }
  #clearBtn:hover { color: var(--text); border-color: var(--accent); }

  .lang-toggle { display: flex; gap: 8px; }
  .lang-toggle button {
    padding: 6px 18px; border-radius: 18px; border: 1px solid var(--accent);
    background: transparent; color: var(--text); cursor: pointer; font-size: .85rem;
  }
  .lang-toggle button.active { background: var(--accent); color: #0b1e2d; font-weight: 600; }

  footer { width: min(760px, 100%); padding: 14px 22px 22px; text-align: center; }
  footer p { font-size: .72rem; color: var(--muted); }

  @media (max-width: 520px) {
    header { padding: 18px 14px 10px; }
    main { padding: 0 14px; }
    .brand h1 { font-size: 1.1rem; }
    .bubble { max-width: 86%; font-size: .9rem; }
    footer { padding: 10px 14px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🏔️</div>
  <div class="brand">
    <h1>Safar Guide</h1>
    <p>AI voice travel guide for Pakistan's Northern Areas</p>
  </div>
  <div class="badge">FYP · Module 1</div>
</header>

<main>
  <div id="conversation" aria-live="polite"></div>

  <div id="chips"></div>

  <div id="inputBar">
    <div class="lang-toggle">
      <button id="langUr" class="active">اردو</button>
      <button id="langEn">English</button>
    </div>
    <button id="micBtn" title="Tap and speak">🎤</button>
    <input id="textInput" placeholder="Apna sawal likhein…" autocomplete="off" aria-label="Type your question">
    <button id="sendBtn" title="Send">➤</button>
  </div>

  <div id="statusRow">
    <div id="status"></div>
    <button id="clearBtn">Clear chat</button>
  </div>
</main>

<footer>
  <p>Safar Guide · Final Year Project — Northern Areas Travel Platform · Free AI voice guide, no sign-up needed</p>
</footer>

<script>
'use strict';
/* ================= State ================= */
let lang = 'ur';                       // 'ur' | 'en'
let recognizing = false;
let thinking = false;

const convo = document.getElementById('conversation');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const textInput = document.getElementById('textInput');
const chipsEl = document.getElementById('chips');

/* ================= Static brain ================= */
const SYSTEM_PROMPT = `You are "Safar Guide", a friendly AI voice travel guide for Pakistan's
Northern Areas (Gilgit-Baltistan, Hunza, Skardu, Naran-Kaghan, Swat), part of a
final-year university project.

Rules:
- Answer in the SAME language the traveler uses (Urdu or English).
- Keep spoken answers SHORT: 2-4 sentences, then offer to say more.
- Use the knowledge base below. Present prices as estimates.
- Never invent hotel names, prices, or road statuses. If unsure, say your data
  may be outdated and the traveler should confirm locally.
- For bookings, mention they can use the platform's travel-agent marketplace.

KNOWLEDGE BASE:
`;

let kbCache = null;
async function getKnowledge() {
  if (kbCache !== null) return kbCache;
  const r = await fetch('knowledge_base.md');
  if (!r.ok) throw new Error('knowledge-base-load-failed');
  kbCache = await r.text();
  return kbCache;
}

async function askAI(question, langInstruction, attempt = 1) {
  const kb = await getKnowledge();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);   // 90s safety timeout
  try {
    const res = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({
        messages: [
          { role: 'system', content: SYSTEM_PROMPT + kb + '\n' + langInstruction },
          { role: 'user', content: question }
        ]
      })
    });
    if (!res.ok) throw new Error('ai-http-' + res.status);
    const reply = (await res.text()).trim();
    if (!reply) throw new Error('ai-empty');
    return reply;
  } catch (err) {
    if (attempt === 1 && err.name !== 'AbortError') {
      await new Promise(r => setTimeout(r, 1200));       // one automatic retry
      return askAI(question, langInstruction, 2);
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ================= UI: messages ================= */
function nowTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function addMsg(who, text) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const avatar = who === 'you' ? '🧑' : '🏔️';
  row.innerHTML =
    '<div class="avatar">' + avatar + '</div>' +
    '<div class="bubble"><span dir="auto"></span><span class="time">' + nowTime() + '</span></div>';
  const bubble = row.querySelector('.bubble');
  bubble.querySelector('[dir="auto"]').textContent = text;
  if (who === 'bot') {
    const btn = document.createElement('button');
    btn.className = 'replay';
    btn.textContent = lang === 'ur' ? '🔊 Dobara suno' : '🔊 Listen again';
    btn.title = 'Replay voice';
    btn.onclick = () => speak(text);   // fresh tap = guaranteed playback
    bubble.appendChild(btn);
  }
  convo.appendChild(row);
  convo.scrollTop = convo.scrollHeight;
  return row;
}
let typingRow = null;
function showTyping() {
  typingRow = document.createElement('div');
  typingRow.className = 'row bot';
  typingRow.innerHTML = '<div class="avatar">🏔️</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  convo.appendChild(typingRow);
  convo.scrollTop = convo.scrollHeight;
}
function hideTyping() { if (typingRow) { typingRow.remove(); typingRow = null; } }

function setStatus(t) { statusEl.textContent = t || ''; }
function setBusy(b) {
  thinking = b;
  sendBtn.disabled = b;
  textInput.disabled = b;
  if (!b) textInput.focus();
}

/* ================= Suggestions ================= */
const SUGGESTIONS = {
  ur: ['Hunza ka best time kab hai?', 'Skardu ka 5 din ka budget batao', 'Naran road kab khulti hai?', 'Fairy Meadows kaise jayen?'],
  en: ['Best time to visit Hunza?', '5-day Skardu budget?', 'When does Naran road open?', 'How to reach Fairy Meadows?']
};
function renderChips() {
  chipsEl.innerHTML = '';
  SUGGESTIONS[lang].forEach(q => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = q;
    b.onclick = () => ask(q);
    chipsEl.appendChild(b);
  });
}

/* ================= Language ================= */
function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  textInput.placeholder = l === 'ur' ? 'Apna sawal likhein…' : 'Type your question…';
  document.getElementById('clearBtn').textContent = l === 'ur' ? 'Chat saaf karein' : 'Clear chat';
  renderChips();
}
document.getElementById('langUr').onclick = e => setLang('ur', e.target);
document.getElementById('langEn').onclick = e => setLang('en', e.target);

/* ================= Voice input ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => { stopListening(); ask(e.results[0][0].transcript); };
  rec.onerror = e => {
    stopListening();
    let help = lang === 'ur' ? ' — type karein.' : ' — please type instead.';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      help = lang === 'ur'
        ? ' — browser settings mein mic ki ijazat (Allow) dein, phir dobara dabayein. Ya type karein.'
        : ' — allow the microphone in browser settings, then tap again. Or type instead.';
    } else if (e.error === 'no-speech') {
      help = lang === 'ur' ? ' — kuch sunai nahi diya, dobara bolein.' : ' — nothing heard, please speak again.';
    }
    setStatus('Mic: ' + e.error + help);
  };
  rec.onend = () => { if (recognizing) stopListening(); };
} else {
  micBtn.disabled = true;
  micBtn.title = 'Voice input not supported in this browser';
}
function stopListening() {
  recognizing = false;
  micBtn.classList.remove('listening');
  try { rec && rec.stop(); } catch (_) {}
}
micBtn.onclick = () => {
  if (!rec || thinking) return;
  stopSpeech();                                   // don't talk over the guide
  if (recognizing) { stopListening(); setStatus(''); return; }
  recognizing = true;
  micBtn.classList.add('listening');
  rec.lang = lang === 'ur' ? 'ur-PK' : 'en-US';
  setStatus(lang === 'ur' ? 'Sun raha hoon… bolein' : 'Listening… speak now');
  try { rec.start(); } catch (_) {}
};

/* ================= Voice output =================
   Urdu: real Urdu voice via Google's free TTS (chunked audio, no key needed).
   English: browser's built-in speech (good voices exist everywhere).
   Each bot message also gets a 🔊 replay button (fresh tap = guaranteed play).
*/
let ttsToken = 0;
let currentAudio = null;

function stopSpeech() {
  ttsToken++;
  try { speechSynthesis.cancel(); } catch (_) {}
  if (currentAudio) { try { currentAudio.pause(); } catch (_) {} currentAudio = null; }
}

function chunkText(text, maxLen = 180) {
  const parts = text.match(/[^۔.!?؟\n]+[۔.!?؟]+|[^۔.!?؟\n]+$/g) || [text];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    const s = p.trim();
    if (!s) continue;
    if ((cur + ' ' + s).trim().length > maxLen && cur) { chunks.push(cur.trim()); cur = s; }
    else cur = (cur ? cur + ' ' : '') + s;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

const IS_EDGE = /Edg\//.test(navigator.userAgent || '');

function playGoogleChunk(chunk, my) {
  // resolves {ok, blocked} — tries two Google hosts, detects autoplay blocks
  return new Promise(resolve => {
    if (my !== ttsToken) return resolve({ ok: true });
    const hosts = ['https://translate.google.com', 'https://translate.googleapis.com'];
    let hi = 0;
    const tryHost = () => {
      if (my !== ttsToken) return resolve({ ok: true });
      const url = hosts[hi] + '/translate_tts?ie=UTF-8&tl=ur&client=tw-ob&q=' + encodeURIComponent(chunk);
      const a = new Audio(url);
      currentAudio = a;
      a.onended = () => resolve({ ok: true });
      a.onerror = () => { hi++; if (hi < hosts.length) tryHost(); else resolve({ ok: false }); };
      try {
        const p = a.play();
        if (p && p.catch) p.catch(err => resolve({ ok: false, blocked: !!err && err.name === 'NotAllowedError' }));
      } catch (_) { resolve({ ok: false }); }
    };
    tryHost();
  });
}

function flagTapToListen() {
  document.querySelectorAll('.row.bot .replay').forEach(b => {
    if (!b.dataset.done) b.classList.add('needs-tap');
  });
  setStatus('🔊 Sunne ke liye jawab ke neeche TAP karein');
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.replay');
  if (b) { b.classList.remove('needs-tap'); b.dataset.done = '1'; }
});

const EDGE_TTS_URL = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4-DFB0-4A1C-B242-38D64E035F96';

/* Tier 0: Microsoft neural Urdu voice (ur-PK-AsadNeural) via WebSocket.
   Ultra-natural. Works in Edge; attempted everywhere, fails gracefully. */
function speakEdgeNeural(text, my) {
  return new Promise(resolve => {
    let settled = false, audioStarted = false, ws = null, timer = null;
    const done = ok => {
      if (!settled) { settled = true; if (timer) clearTimeout(timer); try { ws && ws.close(); } catch (_) {} resolve(ok); }
    };
    try {
      ws = new WebSocket(EDGE_TTS_URL);
    } catch (_) { done(false); return; }
    timer = setTimeout(() => done(false), 15000);
    ws.binaryType = 'arraybuffer';
    const chunks = [];
    const esc = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/[\u0300-\u036F]/g, ' ')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, ' ');
    ws.onopen = () => {
      const ts = new Date().toString();
      ws.send('X-Timestamp:' + ts + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n' +
        JSON.stringify({ context: { synthesis: { audio: { metadataoptions: { sentenceBoundaryEnabled: 'false', wordBoundaryEnabled: 'false' }, outputFormat: 'audio-24khz-48kbitrate-mono-mp3' } } } }));
      const reqId = (crypto.randomUUID ? crypto.randomUUID() : 'req' + Date.now()).replace(/-/g, '');
      const ssml = "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'>" +
        "<voice name='ur-PK-AsadNeural'><prosody rate='+0%' pitch='+0Hz'>" + esc + '</prosody></voice></speak>';
      ws.send('X-RequestId:' + reqId + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + ts + '\r\nPath:ssml\r\n\r\n' + ssml);
    };
    ws.onmessage = ev => {
      if (settled || my !== ttsToken) { done(false); return; }
      if (typeof ev.data === 'string') {
        if (ev.data.indexOf('Path:turn.end') !== -1) {
          if (!chunks.length) { done(false); return; }
          audioStarted = true;
          const a = new Audio(URL.createObjectURL(new Blob(chunks, { type: 'audio/mpeg' })));
          currentAudio = a;
          setStatus('🔊 Bol raha hai…');
          a.onended = () => { if (my === ttsToken) setStatus(''); done(true); };
          a.onerror = () => done(false);
          try { const p = a.play(); if (p && p.catch) p.catch(() => done(false)); }
          catch (_) { done(false); }
        }
      } else {
        const buf = new Uint8Array(ev.data);
        let idx = -1;
        for (let i = 0; i + 3 < buf.length; i++) {
          if (buf[i] === 13 && buf[i + 1] === 10 && buf[i + 2] === 13 && buf[i + 3] === 10) { idx = i; break; }
        }
        if (idx !== -1 && new TextDecoder().decode(buf.slice(0, idx)).indexOf('Path:audio') !== -1) {
          chunks.push(buf.slice(idx + 4).buffer);
        }
      }
    };
    ws.onerror = () => { if (!audioStarted) done(false); };
    ws.onclose = () => { if (!audioStarted) done(false); };
  });
}

async function speakUrdu(text) {
  const my = ++ttsToken;
  // Tier 0: neural voice — only where it can work (Edge); skipped elsewhere to avoid silent waits
  if (IS_EDGE) {
    try { if (await speakEdgeNeural(text, my)) return; } catch (_) {}
    if (my !== ttsToken) return;
  }
  // Tier 1: Google TTS chunks (intelligible on every browser)
  const chunks = chunkText(text);
  let anyOk = false;
  for (const ch of chunks) {
    const r = await playGoogleChunk(ch, my);
    if (my !== ttsToken) return;
    if (r.ok) { anyOk = true; setStatus('🔊 Bol raha hai…'); await new Promise(rr => setTimeout(rr, 250)); }
    else break;
  }
  if (my !== ttsToken) return;
  if (anyOk) { setStatus(''); return; }
  // Tier 2: real device Urdu voice only — never English-voice gibberish
  const v = pickVoice('ur-PK');
  if (v && /^ur/i.test(v.lang)) { speakBrowserWith(text, v, my); return; }
  // Nothing auto-played (browser paused it or network hiccup) — one tap retries everything
  // with a fresh gesture, which browsers always allow.
  flagTapToListen();
}

function speakBrowserWith(text, voice, my) {
  try { speechSynthesis.cancel(); } catch (_) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice.lang;
  u.voice = voice;
  u.rate = 0.95;
  u.onend = u.onerror = () => { if (my === ttsToken) setStatus(''); };
  setStatus('🔊 Bol raha hai…');
  speechSynthesis.speak(u);
}

let voicesReady = false;
function loadVoices() {
  try { if (speechSynthesis.getVoices().length) voicesReady = true; } catch (_) {}
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(target) {
  try {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.lang.toLowerCase() === target.toLowerCase())
        || vs.find(v => v.lang.toLowerCase().startsWith(target.slice(0, 2)))
        || null;
  } catch (_) { return null; }
}
function speakBrowser(text, targetLang, my) {
  if (!('speechSynthesis' in window)) { setStatus(''); return; }
  if (my !== undefined && my !== ttsToken) return;
  stopSpeechSilent();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = targetLang;
  const v = pickVoice(targetLang);
  if (v) u.voice = v;
  u.rate = 0.95;
  u.onend = u.onerror = () => { if (my === undefined || my === ttsToken) setStatus(''); };
  setStatus(targetLang.startsWith('ur') ? '🔊 Bol raha hai…' : '🔊 Speaking…');
  speechSynthesis.speak(u);
}
function stopSpeechSilent() { try { speechSynthesis.cancel(); } catch (_) {} }

function speak(text) {
  stopSpeech();   // stop anything currently playing first
  if (lang === 'ur') speakUrdu(text);
  else speakBrowser(text, 'en-US');
}

/* ================= Ask flow ================= */
async function ask(question) {
  question = (question || '').trim();
  if (!question || thinking) return;
  stopSpeech();
  stopListening();
  addMsg('you', question);
  textInput.value = '';
  setBusy(true);
  showTyping();
  setStatus(lang === 'ur' ? 'Safar Guide soch raha hai…' : 'Safar Guide is thinking…');
  // Force the reply language: Urdu script in the question => MUST reply in Urdu.
  const langInstruction = /[\u0600-\u06FF]/.test(question)
    ? 'IMPORTANT: The user wrote in URDU. You MUST reply fully in Urdu (اردو script).'
    : (lang === 'ur' ? 'Reply in Urdu (اردو).' : 'Reply in English.');
  try {
    const reply = await askAI(question, langInstruction);
    hideTyping();
    addMsg('bot', reply);
    setStatus('');
    speak(reply);
  } catch (err) {
    hideTyping();
    const msg = lang === 'ur'
      ? 'Maazrat, jawab nahi mil saka. Internet check karke dobara poochein.'
      : 'Sorry, I could not get an answer. Please check your connection and try again.';
    addMsg('bot', msg);
    setStatus(lang === 'ur' ? 'Error: dobara koshish karein' : 'Error: please try again');
  } finally {
    setBusy(false);
  }
}

sendBtn.onclick = () => ask(textInput.value);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') ask(textInput.value); });
document.getElementById('clearBtn').onclick = () => {
  stopSpeech(); stopListening();
  convo.innerHTML = '';
  setStatus('');
  greet();
};

/* ================= Welcome ================= */
function greet() {
  const msg = lang === 'ur'
    ? 'Assalam-o-Alaikum! 🏔️ Main Safar Guide hoon — Hunza, Skardu, Naran, Swat ke bare mein kuch bhi poochein. Mic dabayein ya neeche likhein.'
    : 'Hello! 🏔️ I am Safar Guide — ask me anything about Hunza, Skardu, Naran or Swat. Tap the mic or type below.';
  addMsg('bot', msg);
}

renderChips();
greet();
textInput.focus();
